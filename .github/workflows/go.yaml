name: Go build, test and lint

on:
  push:
    tags:
      - v*
    branches:
      - master
  pull_request:
permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        go: ['1.19']
        golangcli: [v1.50.1]
        os: [ubuntu-latest]
    name: lint
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Validate go generate / mod
        shell: bash
        run: |
          go mod tidy
          git --no-pager diff && [[ 0 -eq $(git status --porcelain | wc -l) ]]

      - name: Go Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: ${{ matrix.golangci }}
          args: "--out-${NO_FUTURE}format colored-line-number"
          skip-pkg-cache: true
          skip-build-cache: true

      - name: Go Test
        run: GOMAXPROCS=2 go test -p 2 -race -v ./...

  stable:
    name: test (Go stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup latest stable Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Go Test
        run: GOMAXPROCS=2 go test -p 2 -race -v ./...
      - name: Go Vet
        run: GOMAXPROCS=2 go vet -p 2 ./...
      - name: Go Build
        run: GOMAXPROCS=2 go build -p 2 ./...
